post:
  tags: [Auth]
  summary: Refresh access token
  operationId: refreshToken
  requestBody:
    description: Refresh token is read from HTTP-only cookie
    required: false
  responses:
    '200':
      description: Successfully refreshed a session!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully refreshed a session!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
