delete:
  tags: [Contacts]
  summary: Delete a contact by ID
  operationId: deleteContact
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Successfully deleted a contact!
    '404':
      $ref: '../../../components/schemas/error.yaml#/Error'
    '401':
      $ref: '../../../components/schemas/error.yaml#/Error'
