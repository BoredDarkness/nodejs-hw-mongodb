get:
  tags: [Contacts]
  summary: List contacts with pagination, sorting and filtering
  operationId: listContacts
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
    - in: query
      name: perPage
      schema:
        type: integer
        default: 10
    - in: query
      name: sortBy
      schema:
        type: string
    - in: query
      name: sortOrder
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    - in: query
      name: type
      schema:
        type: string
        enum: [personal, work]
    - in: query
      name: isFavourite
      schema:
        type: boolean
  responses:
    '200':
      description: Successfully found contacts!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                type: array
                items:
                  $ref: '../../components/schemas/contact.yaml#/Contact'
    '401':
      $ref: '../../components/schemas/error.yaml#/Error'
