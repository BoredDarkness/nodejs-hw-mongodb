get:
  tags: [Contacts]
  summary: Get a contact by ID
  operationId: getContactById
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successfully found contact!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact!
              data:
                $ref: '../../../components/schemas/index.yaml#/components/schemas/Contact'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
