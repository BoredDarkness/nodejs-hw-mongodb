post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth.yaml#/RegisterRequest'
  responses:
    '201':
      description: Successfully registered a user!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully registered a user!
              data:
                $ref: '../../components/schemas/auth.yaml#/UserResponse'
    '409':
      description: Email in use
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/error.yaml#/Error'
