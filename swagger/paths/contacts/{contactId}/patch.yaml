patch:
  tags:
    - Contacts
  summary: Update a contact by ID
  operationId: updateContact
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact-input.yaml#/ContactInput'
  responses:
    '200':
      description: Successfully patched a contact!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully patched a contact!'
              data:
                $ref: '../../../components/schemas/contact.yaml#/Contact'
    '400':
      $ref: '../../../components/schemas/error.yaml#/Error'
    '404':
      $ref: '../../../components/schemas/error.yaml#/Error'
    '401':
      $ref: '../../../components/schemas/error.yaml#/Error'
