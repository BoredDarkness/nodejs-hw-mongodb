Contact:
  type: object
  required:
    - _id
    - name
    - phoneNumber
    - contactType
  properties:
    _id:
      type: string
    name:
      type: string
    phoneNumber:
      type: string
    email:
      type: string
      nullable: true
    isFavourite:
      type: boolean
    contactType:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
