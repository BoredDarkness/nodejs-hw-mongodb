post:
  tags:
    - Auth
  summary: Refresh access token
  operationId: refreshToken

  responses:
    '200':
      description: Successfully refreshed a session!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully refreshed a session!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
    '401':
      $ref: '../../components/schemas/error.yaml#/Error'
