post:
  tags: [Auth]
  summary: Register a new user
  operationId: registerUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/index.yaml#/components/schemas/Register'
  responses:
    '201':
      description: Successfully registered a user!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully registered a user!
              data:
                $ref: '../../components/schemas/index.yaml#/components/schemas/Contact'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
    '409':
      description: Conflict – email already in use
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
