    $ref: './paths/auth/register.yaml#/post'
  /auth/login:
    $ref: './paths/auth/login.yaml#/post'
  /auth/refresh:
    $ref: './paths/auth/refresh.yaml#/post'
  /auth/logout:
    $ref: './paths/auth/logout.yaml#/post'

  /contacts:
    get:
      $ref: './paths/contacts/get-contacts.yaml#/get'
