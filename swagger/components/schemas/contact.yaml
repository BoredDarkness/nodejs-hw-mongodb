Contact:
  type: object
  properties:
    _id:
      type: string
    name:
      type: string
    email:
      type: string
      format: email
    phoneNumber:
      type: string
    contactType:
      type: string
    isFavourite:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
