get:
  tags:
    - Contacts
  summary: Get a contact by ID
  operationId: getContactById
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successfully found contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully found contact!'
              data:
                $ref: '../../../components/schemas/contact.yaml#/Contact'
    '404':
      $ref: '../../../components/schemas/error.yaml#/Error'
