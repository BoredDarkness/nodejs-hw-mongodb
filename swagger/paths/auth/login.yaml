post:
  tags:
    - Auth
  summary: Log in a user
  operationId: loginUser
  description: Authenticate user and return access token + set refresh token cookie.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
  responses:
    '200':
      description: Successfully logged in an user!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully logged in an user!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
