Contact:
  type: object
  allOf:
    - $ref: './contact-input.yaml#/ContactInput'
    - type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        photo:
          type: string
          nullable: true
