get:
  tags:
    - Contacts
  summary: Get a contact by its ID
  operationId: getContactById
  description: |
    Returns a single contact belonging to the authenticated user.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      description: ID of the contact
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Contact found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contact'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
