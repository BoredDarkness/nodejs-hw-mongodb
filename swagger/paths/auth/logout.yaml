post:
  tags: [Auth]
  summary: Log out current user
  operationId: logoutUser
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Successfully logged out (no content)
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
