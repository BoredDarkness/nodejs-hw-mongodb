post:
  tags:
    - Auth
  summary: Refresh access token
  operationId: refreshSession
  description: Refresh the session using refresh token from cookie.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Successfully refreshed a session!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully refreshed a session!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
    '401':
      description: Refresh token invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
