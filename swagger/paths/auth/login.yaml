post:
  tags:
    - Auth
  summary: Log in a user
  operationId: loginUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/index.yaml#/components/schemas/Login'
  responses:
    '200':
      description: Successfully logged in a user!
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/TokenResponse'
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
