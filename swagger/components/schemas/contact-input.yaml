ContactInput:
  type: object
  required:
    - name
    - phoneNumber
    - contactType
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 20
    phoneNumber:
      type: string
      example: '+380501234567'
    email:
      type: string
      format: email
      nullable: true
    isFavourite:
      type: boolean
      default: false
    contactType:
      type: string
      enum:
        - personal
        - work
