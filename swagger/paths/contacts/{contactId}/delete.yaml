delete:
  tags: [Contacts]
  summary: Delete a contact by ID
  operationId: deleteContact
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Successfully deleted a contact!
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
