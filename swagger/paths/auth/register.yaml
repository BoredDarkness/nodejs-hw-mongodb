post:
  tags:
    - Auth
  summary: Authenticate a user
  operationId: loginUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
              minLength: 2
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 6
  responses:
    '200':
      description: Successfully logged in a user!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully logged in a user!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
    '401':
      $ref: '../../components/schemas/error.yaml#/Error'
