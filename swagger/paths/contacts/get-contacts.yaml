responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
            message:
              type: string
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Contact'
                page:
                  type: integer
                perPage:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasPreviousPage:
                  type: boolean
                hasNextPage:
                  type: boolean
