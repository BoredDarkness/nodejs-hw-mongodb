openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  description: Backend for managing users and their contacts.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:3000
  - url: https://<your-deployed-url>

tags:
  - name: Auth
    description: Endpoints for registration, login, refresh, logout
  - name: Contacts
    description: CRUD operations on contacts

paths:
  $ref: '../swagger/paths.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    $ref: '../swagger/components/schemas/index.yaml'
