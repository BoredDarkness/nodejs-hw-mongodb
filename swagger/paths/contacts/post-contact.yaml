post:
  tags: [Contacts]
  summary: Create a new contact
  operationId: createContact
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - name
            - email
            - phoneNumber
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phoneNumber:
              type: string
            isFavourite:
              type: boolean
            contactType:
              type: string
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Successfully created a contact!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully created a contact!
              data:
                $ref: '../../components/schemas/index.yaml#/components/schemas/Contact'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
