get:
  tags: [Contacts]
  summary: List contacts with pagination, sorting and filtering
  operationId: listContacts
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
    - in: query
      name: perPage
      schema:
        type: integer
        default: 10
    - in: query
      name: sortBy
      schema:
        type: string
    - in: query
      name: sortOrder
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    - in: query
      name: type
      schema:
        type: string
        enum: [personal, work]
    - in: query
      name: isFavourite
      schema:
        type: boolean
  responses:
    '200':
      description: Successfully found contacts!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                $ref: '../../components/schemas/index.yaml#/components/schemas/PaginatedContacts'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
