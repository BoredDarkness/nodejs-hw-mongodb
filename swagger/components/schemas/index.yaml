components:
  schemas:
    ContactInput:
      $ref: './contact-input.yaml#/ContactInput'
    Contact:
      $ref: './contact.yaml#/Contact'
    Error:
      $ref: './error.yaml#/Error'

    # —————— Auth schemas ——————
    Register:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…

    # —————— Pagination schema ——————
    PaginatedContacts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        page:
          type: integer
        perPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean
      required:
        - data
        - page
        - perPage
        - totalItems
        - totalPages
        - hasPreviousPage
        - hasNextPage
