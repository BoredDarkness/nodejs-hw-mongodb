post:
  tags:
    - Auth
  summary: Refresh access token
  operationId: refreshToken
  responses:
    '200':
      description: Successfully refreshed a session!
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/TokenResponse'
    '401':
      description: Invalid or expired refresh token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/index.yaml#/components/schemas/Error'
