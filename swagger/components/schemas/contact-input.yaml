ContactInput:
  type: object
  required:
    - name
    - email
    - phoneNumber
    - contactType
  properties:
    name:
      type: string
    email:
      type: string
      format: email
    phoneNumber:
      type: string
      example: '+380501234567'
    contactType:
      type: string
      example: 'work'
    isFavourite:
      type: boolean
      default: false
