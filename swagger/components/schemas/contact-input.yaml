ContactInput:
  type: object
  required:
    - name
    - phoneNumber
    - contactType
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 20
    phoneNumber:
      type: string
      pattern: '^\+?\d{7,15}$'
    email:
      type: string
      format: email
      nullable: true
    isFavourite:
      type: boolean
      default: false
    contactType:
      type: string
      enum: [personal, work]
