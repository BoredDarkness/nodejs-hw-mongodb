patch:
  tags: [Contacts]
  summary: Update a contact by ID
  operationId: updateContact
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phoneNumber:
              type: string
            isFavourite:
              type: boolean
            contactType:
              type: string
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Successfully patched a contact!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully patched a contact!
              data:
                $ref: '../../../components/schemas/index.yaml#/components/schemas/Contact'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/index.yaml#/components/schemas/Error'
